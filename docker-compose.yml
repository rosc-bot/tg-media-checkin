name: tg-media-checkin
services:
  tg-media-checkin:
    image: liveinaus/bemby:latest
    container_name: tg-media-checkin
    restart: unless-stopped
    ports:
      - 127.0.0.1:3100:3000
    volumes:
      - ./data:/app/data
      - ./dist:/app/dist
      - ./public:/app/public
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
